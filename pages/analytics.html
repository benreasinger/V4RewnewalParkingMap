<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#35143f">
    <meta name="description" content="Live Renewal Christmas Store parking analytics.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Analytics · Renewal Parking</title>
    <link rel="icon" href="../assets/renewal-logo.png">
    <link rel="stylesheet" href="../stylesheet/styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../script/main.js" defer></script>
  </head>
  <body class="page-analytics" data-page="analytics" data-role="admin">
    <main id="app" class="app-root" aria-label="Parking analytics">
      <section class="boot-screen" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-label">Preparing live analytics…</p>
      </section>
    </main>
    <noscript><p class="noscript-message">Please enable JavaScript to view analytics.</p></noscript>
  </body>
</html>
