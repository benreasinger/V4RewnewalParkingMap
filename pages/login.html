<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#35143f">
    <meta name="description" content="Secure Google sign-in for Renewal Christmas Store volunteers.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sign In · Renewal Parking</title>
    <link rel="icon" href="../assets/renewal-logo.png">
    <link rel="stylesheet" href="../stylesheet/styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../script/main.js" defer></script>
  </head>
  <body class="page-login" data-page="login">
    <main id="app" class="app-root" aria-label="Volunteer sign in">
      <section class="boot-screen boot-screen-auth" aria-live="polite">
        <div class="boot-logo" aria-hidden="true">✚</div>
        <p class="boot-brand">RENEWAL</p>
        <p class="boot-label">Preparing secure sign in…</p>
      </section>
    </main>
    <noscript><p class="noscript-message noscript-message-dark">Please enable JavaScript to sign in.</p></noscript>
  </body>
</html>
