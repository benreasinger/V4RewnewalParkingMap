<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#35143f">
  <meta name="description" content="Assign, track, and complete Christmas Store gift bags.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gift Wrap Tracker · Renewal Parking</title>
  <link rel="icon" href="../assets/renewal-logo.png">
  <link rel="stylesheet" href="../stylesheet/styles.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="../script/main.js" defer></script>
</head>

<body class="page-gift-wrap" data-page="gift-wrap" data-role="wrapper">
  <main id="app" class="app-root" aria-label="Gift wrap tracker">
    <section class="boot-screen" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-label">Loading gift wrap tracker…</p>
    </section>
  </main>
  <noscript>
    <p class="noscript-message">Please enable JavaScript to track gift bags.</p>
  </noscript>
</body>

</html>
